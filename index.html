function defaultData() {
  const teams = TEAMS_SEED.map((t) => ({ ...t, grupo: 1 }));
  const byName = {};
  teams.forEach((t) => (byName[t.nome] = t.id));
  const fixtures = [];
  Object.keys(FIXTURES_R23_A_R38).forEach((rodadaStr) => {
    const rodada = Number(rodadaStr);
    FIXTURES_R23_A_R38[rodada].forEach(([nomeA, nomeB]) => {
      if (byName[nomeA] && byName[nomeB]) {
        fixtures.push({
          id: uid(),
          grupo: 1,
          rodada,
          timeA: byName[nomeA],
          timeB: byName[nomeB],
        });
      }
    });
  });
  return { config: { ...DEFAULT_CONFIG }, teams, fixtures, playoff: null };
}

async function fbGet(path) {
  const res = await fetch(`${FIREBASE_URL}/${path}.json`);
  if (!res.ok) throw new Error("Falha ao ler " + path + ": HTTP " + res.status);
  return res.json();
}

async function fbPut(path, secret, value) {
  const res = await fetch(`${FIREBASE_URL}/${path}.json?auth=${encodeURIComponent(secret)}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(value),
  });
  if (!res.ok) throw new Error("Falha ao gravar " + path + ": HTTP " + res.status);
  return res.json();
}

function resultadoConfronto(ptsA, ptsB, margem) {
  if (ptsA == null || ptsB == null) return null;
  const diff = Math.abs(ptsA - ptsB);
  if (diff <= margem) return "empate";
  return ptsA > ptsB ? "A" : "B";
}

function pontosDoTime(pontuacoes, rodada, teamId) {
  const r = pontuacoes && pontuacoes[rodada];
  if (!r) return null;
  const v = r[teamId];
  return v === undefined || v === null ? null : v;
}

function rodadaMaisRecenteComDados(pontuacoes) {
  let max = 24; // Padrão mínimo na fase nova
  Object.keys(pontuacoes || {}).forEach((r) => {
    const rodada = Number(r);
    const temAlgo = Object.values(pontuacoes[r] || {}).some((v) => v !== null && v !== undefined);
    if (temAlgo && rodada > max) max = rodada;
  });
  return max;
}

function calcularClassificacao(teams, fixtures, pontuacoes, config, ateRodada) {
  const limite = ateRodada === undefined ? Infinity : ateRodada;
  const stats = {};
  teams.forEach((t) => {
    const base = BASE_R23[t.nome] || { pts: 0, j: 0, v: 0, e: 0, d: 0, rv: 0 };
    stats[t.id] = {
      id: t.id, nome: t.nome, grupo: t.grupo,
      j: base.j, v: base.v, e: base.e, d: base.d,
      gp: 0, gc: 0, sg: 0, pts: base.pts, rv: base.rv
    };
  });
  fixtures.forEach((f) => {
    if (f.rodada < 24) return;
    if (f.rodada > limite) return;
    const ptsA = pontosDoTime(pontuacoes, f.rodada, f.timeA);
    const ptsB = pontosDoTime(pontuacoes, f.rodada, f.timeB);
    if (ptsA == null || ptsB == null) return;
    const res = resultadoConfronto(ptsA, ptsB, config.margemEmpate);
    const a = stats[f.timeA], b = stats[f.timeB];
    if (!a || !b) return;
    a.j++; b.j++;
    a.gp += ptsA; a.gc += ptsB;
    b.gp += ptsB; b.gc += ptsA;
    const maxRodada = Math.max(ptsA, ptsB);
    if (ptsA === maxRodada) a.rv++;
    if (ptsB === maxRodada) b.rv++;
    if (res === "empate") { a.e++; b.e++; a.pts += 1; b.pts += 1; }
    else if (res === "A") { a.v++; b.d++; a.pts += 3; }
    else { b.v++; a.d++; b.pts += 3; }
  });
  Object.values(stats).forEach((s) => (s.sg = s.gp - s.gc));
  const arr = Object.values(stats);
  arr.sort((x, y) => y.pts - x.pts || y.v - x.v || y.rv - x.rv || y.sg - x.sg || y.gp - x.gp);
  return arr;
}

        try { liga = await fbGet("liga"); } catch (e) { liga = null; }

        setRodadaSel(maxR >= 24 ? maxR : 24);
      } catch (e) {
        if (!cancelled) setConnStatus("error");
      }
    };
    load();
    const interval = setInterval(load, 12000);
    return () => { cancelled = true; clearInterval(interval); };

    const seed = defaultData();

  const rodadas = Array.from({ length: 16 }, (_, i) => 23 + i);

  return React.createElement("div", { className: "min-h-screen bg-slate-950 text-slate-50" },
    React.createElement("header", { className: "sticky top-0 z-20 bg-slate-950/95 border-b border-slate-800 backdrop-blur" },
      React.createElement("div", { className: "max-w-3xl mx-auto px-4 py-3 flex items-center gap-3" },
        React.createElement("img", { src: "logo-liga-3-pontos.png", alt: "Logo", className: "w-10 h-10 object-contain" }),
        React.createElement("div", { className: "flex-1 min-w-0" },
          React.createElement("h1", { className: "text-sm font-black uppercase tracking-wide text-lime-400 truncate" }, data.config.nomeLiga),
          React.createElement("p", { className: "text-xs text-slate-400" }, "20 times · Rodadas 23–38 · Margem ", data.config.margemEmpate)
        ),
        React.createElement("span", { className: `w-2 h-2 rounded-full ${connStatus === "ok" ? "bg-emerald-400" : "bg-red-400"}` })
      ),
      React.createElement("nav", { className: "max-w-3xl mx-auto px-2 flex gap-1 overflow-x-auto pb-2" },
        TABS.map((t) => React.createElement("button", {
          key: t.key,
          onClick: () => setTab(t.key),
          className: `px-3 py-1.5 rounded-md text-xs font-bold uppercase tracking-wide whitespace-nowrap ${tab === t.key ? "bg-lime-500/20 text-lime-400 border border-lime-600" : "text-slate-400 hover:text-slate-200"}`
        }, t.icon + " " + t.label))
      )
    ),

    React.createElement("main", { className: "max-w-3xl mx-auto px-4 py-4" },
      tab === "classificacao" && React.createElement(ClassTable, { rows: classGeral }),

      tab === "confrontos" && React.createElement("div", null,
        React.createElement("div", { className: "flex gap-1 overflow-x-auto mb-4 pb-1" },
          rodadas.map((r) => React.createElement("button", {
            key: r,
            onClick: () => setRodadaSel(r),
            className: `px-2.5 py-1 rounded text-xs font-bold ${rodadaSel === r ? "bg-lime-500 text-slate-950" : "bg-slate-800 text-slate-400"}`
          }, "R" + r))
        ),
        React.createElement(FixturesList, {
          fixtures: fixturesRodada,
          teams: data.teams,
          pontuacoes,
          config: data.config,
          isAdmin,
          onScoreTeam: setPontuacaoTime
        })
      ),

      tab === "times" && React.createElement("div", { className: "grid sm:grid-cols-2 gap-2" },
        data.teams.map((t) => React.createElement("div", {
          key: t.id,
          className: "bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm font-semibold"
        }, t.nome))
      ),

      tab === "admin" && React.createElement(AdminPanel, {
        isAdmin, pinInput, setPinInput, pinError, unlockAdmin,
        secret, secretInput, setSecretInput, salvarSecret, initLiga, showToast
      })
    ),

    toast && React.createElement("div", {
      className: "fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-800 border border-lime-600 text-slate-50 text-xs font-semibold px-4 py-2.5 rounded-lg shadow-xl z-30"
    }, toast)
  );
}

function ClassTable({ rows }) {
  if (!rows.length) return React.createElement("div", { className: "text-center text-slate-400 py-10 text-sm" }, "Sem dados ainda. Aguarde as pontuações.");
  return React.createElement("div", { className: "overflow-x-auto rounded-lg border border-slate-700" },
    React.createElement("table", { className: "w-full text-xs sm:text-sm" },
      React.createElement("thead", null,
        React.createElement("tr", { className: "bg-slate-800 text-slate-400 uppercase text-xs tracking-wider" },
          React.createElement("th", { className: "px-2 py-2 text-left w-8" }, "#"),
          React.createElement("th", { className: "px-2 py-2 text-left" }, "Time"),
          React.createElement("th", { className: "px-2 py-2 text-center" }, "J"),
          React.createElement("th", { className: "px-2 py-2 text-center" }, "V"),
          React.createElement("th", { className: "px-2 py-2 text-center" }, "E"),
          React.createElement("th", { className: "px-2 py-2 text-center" }, "D"),
          React.createElement("th", { className: "px-2 py-2 text-center" }, "RV"),
          React.createElement("th", { className: "px-2 py-2 text-center font-black" }, "PTS")
        )
      ),
      React.createElement("tbody", { className: "font-mono tabular-nums" },
        rows.map((t, i) => React.createElement("tr", {
          key: t.id,
          className: `border-t border-slate-700 ${i % 2 === 0 ? "bg-slate-900" : "bg-slate-950"} ${i < 4 ? "border-l-2 border-l-lime-400" : i >= 16 ? "border-l-2 border-l-red-500" : ""}`
        },
          React.createElement("td", { className: "px-2 py-2 text-slate-400 font-sans" }, i + 1),
          React.createElement("td", { className: "px-2 py-2 font-sans font-semibold leading-tight" }, t.nome),
          React.createElement("td", { className: "px-2 py-2 text-center" }, t.j),
          React.createElement("td", { className: "px-2 py-2 text-center text-emerald-400" }, t.v),
          React.createElement("td", { className: "px-2 py-2 text-center text-slate-400" }, t.e),
          React.createElement("td", { className: "px-2 py-2 text-center text-red-400" }, t.d),
          React.createElement("td", { className: "px-2 py-2 text-center text-amber-400" }, t.rv),
          React.createElement("td", { className: "px-2 py-2 text-center font-black text-lime-400" }, t.pts)
        ))
      )
    )
  );
}

function FixturesList({ fixtures, teams, pontuacoes, config, isAdmin, onScoreTeam }) {
  const nome = (id) => (teams.find((t) => t.id === id) || {}).nome || "?";
  if (!fixtures.length) return React.createElement("div", { className: "text-center text-slate-400 py-10 text-sm" }, "Nenhum confronto nesta rodada.");
  return React.createElement("div", { className: "space-y-2" },
    fixtures.map((f) => {
      const ptsA = pontosDoTime(pontuacoes, f.rodada, f.timeA);
      const ptsB = pontosDoTime(pontuacoes, f.rodada, f.timeB);
      const res = resultadoConfronto(ptsA, ptsB, config.margemEmpate);
      const corA = res === "A" ? "text-emerald-400" : res === "B" ? "text-red-400" : res === "empate" ? "text-yellow-300" : "text-slate-200";
      const corB = res === "B" ? "text-emerald-400" : res === "A" ? "text-red-400" : res === "empate" ? "text-yellow-300" : "text-slate-200";
      return React.createElement("div", {
        key: f.id,
        className: "flex items-center gap-2 bg-slate-800 border border-slate-700 rounded-lg px-3 py-3"
      },
        React.createElement("span", { className: `flex-1 text-sm font-semibold text-right ${corA}` }, nome(f.timeA)),
        isAdmin
          ? React.createElement("input", { type: "number", step: "0.01", value: ptsA ?? "", onChange: (e) => onScoreTeam(f.rodada, f.timeA, e.target.value), className: "w-16 bg-slate-900 border border-slate-700 rounded text-center py-1 font-mono text-sm", placeholder: "—" })
          : React.createElement("span", { className: "w-16 text-center font-mono font-bold text-sm" }, ptsA != null ? fmt(ptsA) : "—"),
        React.createElement("span", { className: "text-slate-400 text-xs" }, res === "empate" ? "≈" : "x"),
        isAdmin
          ? React.createElement("input", { type: "number", step: "0.01", value: ptsB ?? "", onChange: (e) => onScoreTeam(f.rodada, f.timeB, e.target.value), className: "w-16 bg-slate-900 border border-slate-700 rounded text-center py-1 font-mono text-sm", placeholder: "—" })
          : React.createElement("span", { className: "w-16 text-center font-mono font-bold text-sm" }, ptsB != null ? fmt(ptsB) : "—"),
        React.createElement("span", { className: `flex-1 text-sm font-semibold ${corB}` }, nome(f.timeB))
      );
    })
  );
}

function AdminPanel({ isAdmin, pinInput, setPinInput, pinError, unlockAdmin, secret, secretInput, setSecretInput, salvarSecret, initLiga }) {
  if (!isAdmin) {
    return React.createElement("div", { className: "max-w-xs mx-auto mt-10 text-center" },
      React.createElement("div", { className: "text-3xl mb-3" }, "🔒"),
      React.createElement("p", { className: "text-sm text-slate-400 mb-4" }, "PIN de admin"),
      React.createElement("input", { type: "password", value: pinInput, onChange: (e) => setPinInput(e.target.value), onKeyDown: (e) => e.key === "Enter" && unlockAdmin(), className: "w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-center mb-2", placeholder: "PIN" }),
      pinError && React.createElement("p", { className: "text-red-400 text-xs mb-2" }, "PIN incorreto"),
      React.createElement("button", { onClick: unlockAdmin, className: "w-full bg-lime-500 text-slate-950 font-bold uppercase text-xs py-2 rounded-md" }, "Entrar")
    );
  }
  return React.createElement("div", { className: "max-w-md space-y-4" },
    React.createElement("h2", { className: "text-xs font-black uppercase tracking-widest text-lime-400" }, "Firebase"),
    secret
      ? React.createElement("p", { className: "text-xs text-emerald-400" }, "Segredo configurado ✓")
      : React.createElement("div", { className: "space-y-2" },
          React.createElement("input", { type: "password", value: secretInput, onChange: (e) => setSecretInput(e.target.value), placeholder: "Database secret", className: "w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm" }),
          React.createElement("button", { onClick: salvarSecret, className: "w-full bg-emerald-900 text-emerald-400 border border-emerald-700 font-bold text-xs py-2 rounded" }, "Salvar segredo")
        ),
    React.createElement("button", { onClick: initLiga, className: "w-full bg-lime-500/20 text-lime-400 border border-lime-600 font-bold text-xs py-2 rounded" }, "Inicializar liga no Firebase (times + confrontos)")
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, null));
</script>
</body>
</html>
